name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Generate notices for the runner platform
        run: pnpm audit:licenses
      - name: Validate code, tests and production assets
        run: pnpm validate
      - name: Smoke test production in Chromium
        run: pnpm test:smoke
      - name: Check Cloudflare configuration without publishing
        run: pnpm dlx wrangler@4.149.0 deploy --dry-run --outdir test-results/wrangler
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 1
